services:
  proxy:
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    env_file:
      - path: .env
        required: true
    environment:
      LISTEN_ADDRESS: 0.0.0.0
      WEB_LISTEN_ADDRESS: 0.0.0.0
      ADVERTISE_HOST: ${ADVERTISE_HOST:-127.0.0.1}
      CAMERA_CONFIG_FILE: /config/proxy-config.json
      RECORDING_DIRECTORY: /recordings
      VIDEO_PROFILE: ${VIDEO_PROFILE:-480p}
      VIDEO_FPS: ${VIDEO_FPS:-10}
      STREAM_SETTINGS_FILE: /state/stream-settings.json
      INVENTORY_FILE: /config/camera-inventory.json
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
      - "${STREAM_BIND_ADDRESS:-127.0.0.1}:8080-8083:8080-8083"
      - "${STREAM_BIND_ADDRESS:-127.0.0.1}:8554-8557:8554-8557"
    volumes:
      - type: bind
        source: ./proxy-config.json
        target: /config/proxy-config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./camera-inventory.json
        target: /config/camera-inventory.json
        read_only: true
        bind:
          create_host_path: false
      - proxy-state:/state
      - proxy-clips:/recordings
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3
    stop_grace_period: 15s

volumes:
  proxy-state:
  proxy-clips: